# -------------------------------------------------------
# Servidor
# -------------------------------------------------------
server.port=8080

# -------------------------------------------------------
# Conexão com banco de dados Informix
# -------------------------------------------------------
spring.datasource.url=jdbc:informix-sqli://10.10.0.203:1530/logix:INFORMIXSERVER=tst_tcp
spring.datasource.username=USUAPLIC
spring.datasource.password=UsuAplic
spring.datasource.driver-class-name=com.informix.jdbc.IfxDriver

# -------------------------------------------------------
# HikariCP - Pool de conexões
# -------------------------------------------------------
spring.datasource.hikari.pool-name=CadFilialPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1 FROM systables WHERE tabid = 1
spring.datasource.hikari.initialization-fail-timeout=-1

# -------------------------------------------------------
# Log
# -------------------------------------------------------
logging.level.com.empresa=DEBUG
